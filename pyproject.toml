[project]
name = "jevclip"
version = "0.1.0"
description = "Keep the valuable parts of a video: Jev judges each subtitle segment; out come a cited summary, a highlight reel and the full video minus what is surely worthless."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
jevclip = "jevclip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevclip"]
