[project]
name = "jevclip"
version = "0.1.0"
description = "Keep the valuable parts of a video: Jev judges each segment of the subtitles, code cuts the highlight reel."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
jevclip = "jevclip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevclip"]
