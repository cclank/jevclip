[project]
name = "jevclip"
version = "0.1.1"
description = "Keep the valuable parts of a video: Jev judges each subtitle segment; out come a cited summary, a highlight reel and the full video minus what is surely worthless."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["video", "subtitles", "highlights", "summary", "jev", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/cclank/jevclip"
Repository = "https://github.com/cclank/jevclip"
Issues = "https://github.com/cclank/jevclip/issues"

[project.scripts]
jevclip = "jevclip.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevclip"]
